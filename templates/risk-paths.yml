# Copy to .github/risk-paths.yml in your project (optional).
#
# risk-gate reads this from the PR's BASE branch, so a PR cannot change the
# rules it is judged by. This file is itself an ask-first path.
#
# ask_first: ADDED to the defaults in dev-pipeline/config/risk-paths.default.yml
#            (you cannot remove a default from here).
# low_risk:  if present, REPLACES the default low-risk list.

ask_first:
  - lib/gate/**
  - scripts/deploy.mjs

