# Copy to .github/workflows/risk-gate.yml in your project.
#
# Runs on pull_request and again on every review, so an approval clears an
# ask-first PR without a re-push. Kept separate from pr-checks.yml so review
# events never create skipped (= passing) CI checks.

# Pinning: @v1 follows the latest v1.x release (once the tag ruleset in
# docs/tag-ruleset.md is applied, only admins can move v1). The strongest
# pin is a release's full commit SHA (e.g. v1.0.0's), with pipeline_ref
# set to the same SHA. Find it with:
#   git ls-remote https://github.com/Calvixio/dev-pipeline refs/tags/v1.0.0^{}
# Never pin to a branch: whatever is on it receives this repo's secrets.

name: Risk gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

concurrency:
  group: risk-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  risk-gate:
    uses: Calvixio/dev-pipeline/.github/workflows/risk-gate.yml@v1
    permissions:
      contents: read
      pull-requests: write
    with:
      pipeline_ref: v1  # keep equal to the @ref above
      approvers: HelpOnTheWay-bit
      # config_path: .github/risk-paths.yml   (default; read from the base branch)
