# Copy to .github/workflows/pr-checks.yml in your project.
#
# CI with a real preview + smoke test, and the independent reviewer.
# Runs on pull_request only. Do not add pull_request_review here: on that
# event these jobs would be skipped, and GitHub counts a skipped required
# check as passing. The risk gate has its own file (risk-gate.yml) for that.

# Pinning: @v1 follows the latest v1.x release (once the tag ruleset in
# docs/tag-ruleset.md is applied, only admins can move v1). The strongest
# pin is a release's full commit SHA (e.g. v1.0.0's), with pipeline_ref
# set to the same SHA. Find it with:
#   git ls-remote https://github.com/Calvixio/dev-pipeline refs/tags/v1.0.0^{}
# Never pin to a branch: whatever is on it receives this repo's secrets.

name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    uses: Calvixio/dev-pipeline/.github/workflows/ci-opennext.yml@v1
    permissions:
      contents: read
    with:
      pipeline_ref: v1  # keep equal to the @ref above
      node_version: "24"
      # use_supabase: true            # starts local Supabase, db reset applies migrations + seed.sql
      # lint_command: npm run lint
      # typecheck_command: npx tsc --noEmit
      # preview_vars: |               # non-secret runtime vars for the preview only
      #   SOME_FLAG=1
      smoke_paths: |
        /
        /about
        # /account | Sign in          <- optional text that must appear

  reviewer:
    uses: Calvixio/dev-pipeline/.github/workflows/reviewer.yml@v1
    permissions:
      contents: read
      pull-requests: write
    with:
      pipeline_ref: v1  # keep equal to the @ref above
    # Pass both; set only one in the repo. The OAuth token wins if both exist.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
